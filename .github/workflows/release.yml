name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: SemVer increment to publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0

      - name: Activate the repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the current commit
        run: pnpm exec commitlint --last --verbose

      - name: Run the complete quality gate
        run: pnpm check

      - name: Validate the Relizy release plan
        run: pnpm release:check

  release:
    name: Create unified GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0

      - name: Activate the repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release with Relizy
        id: release
        run: |
          pnpm release --${RELEASE_TYPE} --yes
          echo "tag=$(git describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish npm packages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org

      - name: Activate the repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish public packages
        run: pnpm publish:npm
